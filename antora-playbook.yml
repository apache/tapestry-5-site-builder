site:
  title: Apache Tapestry
  start_page: main::about.adoc

# Antora caches the content repositories below and, by default, reuses that
# cache on every later run. On a long-lived CI agent that means new branches
# and new commits in tapestry-5-site are never seen. Always refetch.
runtime:
  fetch: true

content:
  sources:
  - url: https://gitbox.apache.org/repos/asf/tapestry-5-site.git
    branches: [main, 5.*]

# Pin output directory for CI
output:
  dir: ./build/site
  clean: true

urls:
  # Make the latest version appear as 'current' in URLs (instead of the version number).
  # That way, Redirects (configured in the .htaccess file) don't have to be updated for each new version.
  latest_version_segment: current
asciidoc:

  extensions:
  - asciidoctor-kroki
  - ./lib/issue-processor
  - ./lib/javadoc-processor

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./supplemental-ui

antora:
  extensions:
  - require: '@antora/lunr-extension'
    index_latest_only: true
    index_by_heading: true
