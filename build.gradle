plugins {
    id 'org.antora' version '1.0.0'
}

node {
    version = '24'
}

antora {
    version = '3.1.15'
    packages = [
        // '@antora/collector-extension': 'latest'
        '@antora/lunr-extension': '1.0.0-alpha.13',
        'asciidoctor-kroki'     : '0.18.1'
    ]
}

tasks.register('copyStaticRootFiles', Copy) {
    from('.htaccess')
    into(layout.buildDirectory.dir('site'))
    mustRunAfter('antora')
}

tasks.named('antora') {
    finalizedBy('copyStaticRootFiles')

    // ./gradlew antora -PlocalPlaybook  builds from a sibling tapestry-5-site
    // checkout instead of fetching the content from gitbox.
    if (project.hasProperty('localPlaybook')) {
        playbook = 'antora-playbook-local.yml'
    }
}
